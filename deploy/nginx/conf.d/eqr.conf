# Web tier for Campus ERP (baked into the `web` image, see Dockerfile stage 4).
# Static build output is served from disk here; everything dynamic is proxied to
# the Node container. `map`/`upstream` are legal because conf.d loads in http context.

map $http_upgrade $eqr_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream eqr_app {
    server app:3000;
}

server {
    listen 80;
    listen [::]:80;
    # Uncomment after certbot has issued a certificate, then
    # `docker compose up -d web`. The blocks below then serve HTTP and HTTPS.
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;
    # ssl_certificate     /etc/nginx/certs/live/eqr.example.edu/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/live/eqr.example.edu/privkey.pem;
    server_name _;

    root /usr/share/nginx/html;

    # Attendance reports are generated and uploaded as Excel/Word/PDF files.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Clerk and Supabase build absolute auth/redirect URLs from these.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $eqr_connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Content-hashed bundles never change once published.
    location /assets/ {
        expires 1y;
        try_files $uri @app;
    }

    # A cached worker or manifest pins clients to the previous release, so these
    # must be revalidated on every load.
    location ~* ^/(sw\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        expires -1;
        try_files $uri @app;
    }

    location ~* ^/(favicon\.png|robots\.txt|apple-touch-icon\.png|icons/.*)$ {
        expires 7d;
        try_files $uri @app;
    }

    # Server-rendered pages, server functions and auth callbacks.
    location / {
        proxy_pass http://eqr_app;
        expires -1;
    }

    location @app {
        proxy_pass http://eqr_app;
    }
}
